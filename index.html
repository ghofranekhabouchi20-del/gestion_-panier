
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de Panier</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">SHOP<span>NOW</span></div>

        <nav>
            <a href="#accueil">Accueil</a>
            <a href="#produits">Produits</a>
            <a href="#panier">Mon Panier 🛒</a>
        </nav>
    </header>

    <main>
        <section class="hero" id="accueil">
            <div>
                <p class="welcome">BIENVENUE CHEZ SHOPNOW</p>
                <h1>Découvrez nos produits<br>et faites votre choix.</h1>
                <p>Une sélection de produits pour tous vos besoins.</p>
                <a href="#produits" class="hero-button">Découvrir les produits</a>
            </div>
        </section>

        <section id="produits">
            <h2>Nos Produits</h2>
            <p class="subtitle">Découvrez notre collection</p>

            <div id="liste-produits"></div>
        </section>

        <section id="panier">
            <h2>Mon Panier 🛒</h2>
            <div id="contenu-panier"></div>

            <div class="total-box">
                <h3>Total : <span id="total">0</span> DT</h3>
                <button id="vider-panier">Vider le panier</button>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 SHOPNOW - Gestion de Panier</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
